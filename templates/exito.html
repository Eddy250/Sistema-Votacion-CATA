{% extends "layout.html" %}

{% block content %}
<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-70 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl p-10 max-w-sm w-full mx-4 text-center animate-pulse-once">
        <div class="mx-auto flex items-center justify-center h-24 w-24 rounded-full bg-green-100 mb-6 shadow-inner">
            <svg class="h-14 w-14 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        <h2 class="text-3xl font-extrabold text-gray-900 mb-3">¡Gracias por Votar!</h2>
        <p class="text-gray-500 mb-8 font-medium">Tu voto fue registrado de manera anónima y exitosa.</p>
        
        <div class="flex flex-col items-center justify-center">
            <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-600 mb-3"></div>
            <p class="text-sm text-blue-600 font-semibold tracking-wide">Preparando siguiente turno...</p>
        </div>
    </div>
</div>

<style>
    @keyframes scaleIn {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    .animate-pulse-once {
        animation: scaleIn 0.4s ease-out forwards;
    }
</style>

<script>
    // Redirigir al inicio (login) después de 2.5 segundos
    setTimeout(function() {
        window.location.replace('/');
    }, 2800);
</script>
{% endblock %}

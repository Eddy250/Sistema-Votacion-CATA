{% extends "layout.html" %}

{% block content %}
<div class="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto text-center">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Ingreso de Votante</h2>
    <p class="text-gray-600 mb-6 text-sm">Por favor, ingresa tu código único de estudiante para acceder a la cabina de
        votación. Recuerda que tu voto es secreto y único.</p>

    <form action="/" method="POST" class="space-y-4">
        <div>
            <label for="codigo" class="block text-left text-sm font-medium text-gray-700 mb-1">Código
                Estudiantil</label>
            <input type="text" id="codigo" name="codigo" required autofocus
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"
                placeholder="Ej: 000000">
        </div>
        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">
            Ingresar y Votar
        </button>
    </form>
</div>
{% endblock %}
